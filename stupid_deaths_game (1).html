<!DOCTYPE html>

    <meta charset="UTF-8">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            /* Haunted Poker Table Felt */
            background: radial-gradient(circle at center, #1a4a2b 0%, #0a2012 60%, #000000 100%);
            color: #e2e8f0;
        }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flip-transition { transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        /* New Animations */
        @keyframes burnUp {
            0% { transform: scale(1) translateY(0); opacity: 1; filter: drop-shadow(0 0 0px #ff4500); }
            30% { filter: drop-shadow(0 -10px 20px #ff4500) sepia(0.8) hue-rotate(-30deg); }
            100% { transform: scale(0.6) translateY(-100px); opacity: 0; filter: drop-shadow(0 -50px 60px #ff0000) sepia(1) hue-rotate(-50deg) saturate(5) contrast(2); }
        }
        .animate-burn { animation: burnUp 0.8s ease-in forwards; pointer-events: none; }

        @keyframes dealCard {
            0% { transform: translate(100vw, -100vh) rotate(540deg) scale(0.3); opacity: 0; }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
        }
        .animate-deal { animation: dealCard 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Hide scrollbar for textarea */
        textarea::-webkit-scrollbar { display: none; }
        textarea { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

            { bg: 'bg-yellow-900', border: 'border-yellow-400', text: 'text-yellow-400', shadow: 'shadow-[0_0_10px_rgba(250,204,21,0.5)]' },
            { bg: 'bg-orange-900', border: 'border-orange-400', text: 'text-orange-400', shadow: 'shadow-[0_0_10px_rgba(251,146,60,0.5)]' },
            { bg: 'bg-cyan-900', border: 'border-cyan-400', text: 'text-cyan-400', shadow: 'shadow-[0_0_10px_rgba(34,211,238,0.5)]' },
            { bg: 'bg-pink-900', border: 'border-pink-400', text: 'text-pink-400', shadow: 'shadow-[0_0_10px_rgba(244,114,182,0.5)]' }
        ];

        // --- STATE ---
        let teams = [];
        let questions = [];
        let currentTeamIdx = 0;
        let currentQuestionIdx = 0;
        let currentOptions = [];
        let turnPhase = 'reveal'; // reveal, guessing, gamble_offer, flipping_coin, result
        let cardFlipped = false;
        let showHint = false;

        // --- DOM ELEMENTS ---
        const views = {
            setup: document.getElementById('setup-view'),
            game: document.getElementById('game-view'),
            gameover: document.getElementById('gameover-view')
        };
        const playersInput = document.getElementById('players-input');
        const btnCreateTeams = document.getElementById('btn-create-teams');
        const scoreboardContainer = document.getElementById('scoreboard-container');
        const currentTeamName = document.getElementById('current-team-name');
        const questionCounter = document.getElementById('question-counter');
        const totalQuestions = document.getElementById('total-questions');
        const cardContainer = document.getElementById('card-container');
        const cardInner = document.getElementById('card-inner');
        const victimName = document.getElementById('victim-name');
        const interactionArea = document.getElementById('interaction-area');

        // --- INITIALIZATION ---
        function init() {
            // Prepare questions
            questions = shuffleArray(RAW_TRIVIA).map(q => ({
                ...q,
                options: shuffleArray([q.correct, q.wrong1, q.wrong2])
            }));
            totalQuestions.textContent = questions.length;

            btnCreateTeams.addEventListener('click', handleCreateTeams);
            cardContainer.addEventListener('click', handleCardClick);
        }

        // --- ACTIONS ---
        function handleCreateTeams() {
            const text = playersInput.value;
            const names = text.split('\n').map(n => n.trim()).filter(n => n);
            if (names.length === 0) return;

            const shuffledNames = shuffleArray(names);
            const numTeams = Math.ceil(shuffledNames.length / 4) || 1;
            
            teams = Array.from({ length: numTeams }, (_, i) => ({
                id: i + 1,
                name: `Team ${i + 1}`,
                players: [],
                score: 0,
                color: TEAM_COLORS[i % TEAM_COLORS.length]
            }));

            shuffledNames.forEach((name, i) => {
                teams[i % numTeams].players.push(name);
            });

            switchView('game');
            updateGameUI();
        }

        function switchView(viewName) {
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
            if (viewName === 'game') views[viewName].classList.add('flex');
            if (viewName === 'gameover') views[viewName].classList.add('flex');
        }

        function updateGameUI() {
            const currentTeam = teams[currentTeamIdx];
            const currentQ = questions[currentQuestionIdx];
            currentOptions = currentQ.options;

            // Scoreboard
            scoreboardContainer.innerHTML = teams.map((t, i) => `
                <div class="p-3 rounded-lg flex justify-between items-center transition-all ${i === currentTeamIdx ? `${t.color.bg} border-2 ${t.color.border} animate-bounce ${t.color.shadow}` : 'bg-slate-700 border-2 border-transparent'}">
                    <div>
                        <div class="font-bold ${i === currentTeamIdx ? t.color.text : 'text-slate-200'}">${t.name}</div>
                        <div class="text-xs text-slate-400 truncate w-24" title="${t.players.join(', ')}">${t.players.join(', ')}</div>
                    </div>
                    <div class="text-xl font-black ${i === currentTeamIdx ? t.color.text : 'text-slate-200'}" id="score-team-${i}">${t.score}</div>
                </div>
            `).join('');

            // Headers
            currentTeamName.textContent = currentTeam.name;
            currentTeamName.className = `font-bold text-3xl drop-shadow-[0_0_5px_currentColor] ${currentTeam.color.text}`;
            questionCounter.textContent = currentQuestionIdx + 1;
            victimName.textContent = currentQ.person;

            renderInteractionArea();
        }

        function updateScoreInUIOnly() {
            teams.forEach((t, i) => {
                const el = document.getElementById(`score-team-${i}`);
                if (el) el.textContent = t.score;
            });
        }

        function applyScore(change) {
            teams[currentTeamIdx].score += change;
            updateScoreInUIOnly();
        }

        function handleCardClick() {
            if (turnPhase === 'reveal' && !cardFlipped) {
                cardFlipped = true;
                cardInner.classList.add('rotate-y-180');
                turnPhase = 'guessing';
                renderInteractionArea();
            }
        }

        function handleGuess(selectedOption) {
            if (turnPhase !== 'guessing') return;
            const currentQ = questions[currentQuestionIdx];
            const isCorrect = selectedOption === currentQ.correct;

            if (isCorrect) {
                turnPhase = 'gamble_offer';
                renderInteractionArea({ msg: `Correct! 💀 You secured ${currentQ.points} points.`, type: 'success' });
            } else {
                turnPhase = 'result';
                renderInteractionArea({ msg: `Wrong! The correct answer was: "${currentQ.correct}". You get 0 points.`, pointsChange: 0, type: 'error' });
            }
        }

        function handleRevealHint() {
            showHint = true;
            applyScore(-1); // Deduct 1 point immediately
            renderInteractionArea();
        }

        function handleGambleDecision(gambleSide) {
            const currentQ = questions[currentQuestionIdx];
            const riskAmount = currentQ.points * 2; // Win or lose double the question points

            if (!gambleSide) {
                // Kept points
                applyScore(currentQ.points);
                turnPhase = 'result';
                renderInteractionArea({ msg: `Played it safe! +${currentQ.points} Points.`, pointsChange: currentQ.points, type: 'success' });
            } else {
                // Gamble
                turnPhase = 'flipping_coin';
                renderInteractionArea({ msg: `Flipping for ${gambleSide.toUpperCase()}...` });
                
                setTimeout(() => {
                    const isHeads = Math.random() > 0.5;
                    const result = isHeads ? 'heads' : 'tails';
                    
                    if (gambleSide === result) {
                        applyScore(riskAmount);
                        turnPhase = 'result';
                        renderInteractionArea({ 
                            msg: `It's ${result.toUpperCase()}! You won the gamble! +${riskAmount} Points!`, 
                            pointsChange: riskAmount, 
                            type: 'success', 
                            coin: result 
                        });
                    } else {
                        applyScore(-riskAmount);
                        turnPhase = 'result';
                        renderInteractionArea({ 
                            msg: `It's ${result.toUpperCase()}! You lost the gamble! -${riskAmount} Points!`, 
                            pointsChange: -riskAmount, 
                            type: 'error', 
                            coin: result 
                        });
                    }
                }, 2000);
            }
        }

        function nextTurn() {
            // 1. Burn up the old card
            cardContainer.classList.add('animate-burn');
            
            // Clear the interaction area immediately so it feels like the turn is over
            interactionArea.innerHTML = '';
            
            // 2. Wait for the burn animation to finish
            setTimeout(() => {
                // Reset card logic
                cardFlipped = false;
                cardInner.classList.remove('rotate-y-180');
                turnPhase = 'reveal';
                showHint = false;
                
                // Hide it instantly before resetting transform
                cardContainer.style.opacity = '0';
                cardContainer.classList.remove('animate-burn');
                
                if (currentQuestionIdx + 1 >= questions.length) {
                    endGame();
                } else {
                    currentQuestionIdx++;
                    currentTeamIdx = (currentTeamIdx + 1) % teams.length;
                    updateGameUI();
                    
                    // 3. Deal the new card
                    setTimeout(() => {
                        cardContainer.style.opacity = ''; // let CSS handle opacity
                        cardContainer.classList.add('animate-deal');
                        
                        // Cleanup deal class after animation completes
                        setTimeout(() => {
                            cardContainer.classList.remove('animate-deal');
                        }, 650);
                    }, 50); // slight delay to ensure DOM updates before animation
                }
            }, 800); // Matches the 0.8s of the burnUp animation
        }

        function endGame() {
            switchView('gameover');
            const sortedTeams = [...teams].sort((a, b) => b.score - a.score);
            const container = document.getElementById('final-scores-container');
            container.innerHTML = sortedTeams.map((t, idx) => `
                <div class="flex justify-between items-center bg-slate-700 p-4 rounded-lg mb-3">
                    <div>
                        <span class="text-2xl font-bold mr-4">${idx === 0 ? '🏆' : '💀'} ${t.name}</span>
                        <span class="text-slate-400 text-sm">${t.players.join(', ')}</span>
                    </div>
                    <span class="text-3xl font-black text-white">${t.score} pts</span>
                </div>
            `).join('');
        }

        // --- RENDERING VIEWS ---
        function renderInteractionArea(data = {}) {
            interactionArea.innerHTML = ''; // clear

            if (turnPhase === 'guessing') {
                const currentQ = questions[currentQuestionIdx];
                const container = document.createElement('div');
                container.className = 'flex flex-col gap-3 animate-fade-in w-full';

                if (!showHint) {
                    const hintBtn = document.createElement('button');
                    hintBtn.className = 'mb-2 text-orange-400 hover:text-orange-300 underline font-bold text-center';
                    hintBtn.textContent = 'Need a hint? (-1 Point)';
                    hintBtn.onclick = handleRevealHint;
                    container.appendChild(hintBtn);
                } else {
                    const hintDiv = document.createElement('div');
                    hintDiv.className = 'mb-2 p-4 bg-orange-900/30 border border-orange-500 rounded-xl text-orange-200 italic text-center shadow-inner';
                    hintDiv.innerHTML = `💡 <strong>Hint:</strong> ${currentQ.hint}`;
                    container.appendChild(hintDiv);
                }

                currentOptions.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'w-full text-left p-4 bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-orange-500 rounded-xl shadow-md transition-all text-slate-200 text-lg md:text-xl font-medium active:scale-[0.98]';
                    btn.innerHTML = `<span class="font-bold text-teal-400 mr-3">${['A', 'B', 'C'][i]}.</span> ${opt}`;
                    btn.onclick = () => handleGuess(opt);
                    container.appendChild(btn);
                });
                interactionArea.appendChild(container);
            }
            else if (turnPhase === 'gamble_offer') {
                const currentQ = questions[currentQuestionIdx];
                interactionArea.innerHTML = `
                    <div class="bg-slate-800 border-2 border-green-500 rounded-xl p-6 text-center shadow-lg animate-fade-in w-full">
                        <h3 class="text-2xl font-bold text-green-400 mb-2">${data.msg}</h3>
                        <p class="text-slate-300 mb-6">Do you want to gamble your points on a coin flip?<br><span class="text-sm text-slate-400">(Win = +${currentQ.points * 2}, Lose = -${currentQ.points * 2})</span></p>
                        <div class="flex flex-col sm:flex-row justify-center gap-4">
                            <button onclick="handleGambleDecision(null)" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold text-white transition-colors">
                                Keep ${currentQ.points} Points
                            </button>
                            <button onclick="handleGambleDecision('heads')" class="px-6 py-3 bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-400 hover:to-red-400 rounded-lg font-bold text-white shadow-lg transition-transform hover:scale-105">
                                🪙 Gamble HEADS
                            </button>
                            <button onclick="handleGambleDecision('tails')" class="px-6 py-3 bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-400 hover:to-red-400 rounded-lg font-bold text-white shadow-lg transition-transform hover:scale-105">
                                🪙 Gamble TAILS
                            </button>
                        </div>
                    </div>
                `;
            }
            else if (turnPhase === 'flipping_coin') {
                interactionArea.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-8 w-full">
                        <div class="text-6xl animate-bounce mb-4 shadow-xl rounded-full">🪙</div>
                        <h3 class="text-2xl font-bold text-orange-400 animate-pulse-fast">${data.msg}</h3>
                    </div>
                `;
            }
            else if (turnPhase === 'result') {
                let boxClass = 'bg-slate-800 border-slate-600';
                let textClass = 'text-slate-300';
                if (data.type === 'success') { boxClass = 'bg-slate-800 border-green-500'; textClass = 'text-green-400'; }
                if (data.type === 'error') { boxClass = 'bg-red-900/30 border-red-500'; textClass = 'text-red-400'; }

                let coinHtml = '';
                if (data.coin) {
                    coinHtml = `<div class="text-5xl mb-4">🪙 (${data.coin === 'heads' ? 'Heads' : 'Tails'})</div>`;
                }

                interactionArea.innerHTML = `
                    <div class="border-2 rounded-xl p-6 text-center shadow-lg animate-fade-in w-full ${boxClass}">
                        ${coinHtml}
                        <h3 class="text-2xl font-bold mb-4 ${textClass}">${data.msg}</h3>
                        <button onclick="nextTurn()" class="px-8 py-3 bg-teal-600 hover:bg-teal-500 rounded-lg font-bold text-white text-lg shadow-[0_0_10px_rgba(20,184,166,0.5)] transition-all active:scale-95">
                            Next Turn ➔
                        </button>
                    </div>
                `;
            }
        }

        // Start
        init();
    </script>
</body>
</html>
